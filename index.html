(() => {
  'use strict';
  // Only whitespace outside string/comment tokens changes. In particular, the
  // semicolons in for (...) and escaped newlines in strings remain untouched.
  const lexer=/\/\/[^\r\n]*|\/\*[\s\S]*?\*\/|"(?:\\[\s\S]|[^"\\])*"|'(?:\\[\s\S]|[^'\\])*'|#[^\r\n]*|\s+|[{};()]|[^\s{};()"'\/#]+|[\s\S]/g;
  function formatCode(source,language) {
    if(language!=='c'&&language!=='java')return source;
    const parts=String(source).match(lexer)||[],lines=[];
    let line='',indent=0,parens=0,closed=false;
    const flush=()=>{if(line.trim())lines.push('  '.repeat(indent)+line.trim());line='';closed=false;};
    for(const token of parts){
      if(/^\s+$/.test(token)){if(line&&!line.endsWith(' '))line+=' ';continue;}
      if(closed&&![';','}',')'].includes(token)&&!token.startsWith(',')&&!token.startsWith(']')){
        if(/^(else|catch|finally)\b/.test(token)){line=line.trimEnd()+' ';closed=false;}else flush();
      }
      if(token==='{'){
        line=line.trimEnd()+(line.trim()?' ':'')+'{';flush();indent++;
      }else if(token==='}'){
        flush();indent=Math.max(0,indent-1);line='}';closed=true;
      }else if(token===';'){
        line=line.trimEnd()+';';if(parens===0)flush();else line+=' ';
      }else if(token==='('){line+=token;parens++;}
      else if(token===')'){line=line.trimEnd()+token;parens=Math.max(0,parens-1);}
      else if(token.startsWith('//')||token.startsWith('#')){line+=token;flush();}
      else line+=token;
    }
    flush();return lines.join('\n');
  }
  window.CodeDisplay={formatCode};
})();

    root.innerHTML=`<div class="ink-tools" role="group" aria-label="그림 도구"><div class="row wrap">${[['pen','펜'],['marker','형광펜'],['eraser','지우개']].map(([tool,name])=>`<button type="button" data-ink-tool="${tool}" aria-pressed="${preferences.tool===tool}">${name}</button>`).join('')}</div><div class="row wrap">${COLORS.map((color,i)=>`<button type="button" class="ink-color" data-ink-color="${color}" style="--ink-color:${color}" aria-label="${['검정','파랑','빨강','초록'][i]} 펜" aria-pressed="${preferences.color===color}"></button>`).join('')}<label class="ink-width">굵기 <select aria-label="펜 굵기"><option value="2">얇게</option><option value="3">보통</option><option value="6">굵게</option></select></label></div><div class="row wrap"><button type="button" data-ink-action="undo" disabled>실행 취소</button><button type="button" data-ink-action="redo" disabled>다시 실행</button><button type="button" data-ink-action="clear" disabled>전체 지우기</button><button type="button" data-ink-action="download">그림 저장</button></div></div><div class="ink-paper"><canvas width="1000" height="700" aria-label="이 문제의 손필기 그림장. Apple Pencil, 터치펜, 손가락, 마우스로 그릴 수 있습니다."></canvas></div><div class="ink-footer"><label><input type="checkbox" data-ink-finger ${preferences.finger?'checked':''}> 손가락으로도 그리기</label><span data-ink-status role="status">필기 불러오는 중…</span></div><p class="ink-tip">Apple Pencil·터치펜을 사용할 때 손가락 그리기를 끄면 손바닥 오입력을 줄일 수 있습니다. 페이지는 종이 바깥에서 스크롤하세요.</p>`;
    const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
    root.querySelector('select').value=String(preferences.size);
    const status=root.querySelector('[data-ink-status]');
    const session={root,id,disposed:false,loaded:false,stroke:null,pointer:null,history:new Timeline(),writes:Promise.resolve(),updatedAt:0};active=session;
    let lastPenAt=0,clearPending=false;
    const buttons=()=>{
      root.querySelector('[data-ink-action=undo]').disabled=!session.history.past.length;
      root.querySelector('[data-ink-action=redo]').disabled=!session.history.future.length;
      root.querySelector('[data-ink-action=clear]').disabled=!session.history.strokes.length;
    };
    const redraw=()=>{ctx.clearRect(0,0,WIDTH,HEIGHT);session.history.strokes.forEach(s=>paint(ctx,s));if(session.stroke)paint(ctx,session.stroke);buttons();};
    const persist=()=>{
      const page={id,updatedAt:Math.max(Date.now(),session.updatedAt+1),strokes:session.history.strokes};session.updatedAt=page.updatedAt;
      status.textContent='저장 중…';
      try{localStorage.setItem(JOURNAL,JSON.stringify(page));}catch{}
      session.writes=session.writes.catch(()=>{}).then(()=>store.put(page)).then(()=>{if(!session.disposed&&session.updatedAt===page.updatedAt)status.textContent='이 기기에 저장됨';}).catch(()=>{status.textContent='저장 실패 · 그림을 파일로 저장하세요';notify('필기 저장 공간을 확인하고 그림 저장 또는 백업을 이용하세요.');});
    };
    const point=e=>{const rect=canvas.getBoundingClientRect();return [clamp((e.clientX-rect.left)/rect.width,0,1),clamp((e.clientY-rect.top)/rect.height,0,1),e.pointerType==='pen'?clamp(e.pressure||.1,.1,1):.5];};
    const finish=()=>{
      if(!session.stroke)return;
      session.history.change([...session.history.strokes,session.stroke]);session.stroke=null;session.pointer=null;clearPending=false;
      root.querySelector('[data-ink-action=clear]').textContent='전체 지우기';redraw();persist();
    };
    session.finish=finish;
    canvas.addEventListener('pointerdown',e=>{
      if(!session.loaded||session.stroke||e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;
      if(session.history.strokes.length>=4000){notify('이 그림장이 가득 찼습니다. 그림 저장 후 새로 정리해 주세요.');return;}
      if(e.pointerType==='pen')lastPenAt=Date.now();
      if(e.pointerType==='touch'&&(!preferences.finger||Date.now()-lastPenAt<1000))return;
      e.preventDefault();const rect=canvas.getBoundingClientRect();
      session.pointer=e.pointerId;session.stroke={tool:preferences.tool,color:preferences.color,width:preferences.size/rect.width,points:[point(e)]};
      canvas.setPointerCapture(e.pointerId);redraw();status.textContent='필기 중…';
    });
    canvas.addEventListener('pointermove',e=>{
      if(!session.stroke||e.pointerId!==session.pointer)return;e.preventDefault();
      const samples=e.getCoalescedEvents?.()||[e];
      for(const sample of samples.length?samples:[e]){
        const p=point(sample),a=session.stroke.points.at(-1);
        if(Math.hypot(p[0]-a[0],p[1]-a[1])<.0005)continue;
        if(session.stroke.points.length>=5000){finish();notify('긴 획을 저장했습니다. 펜을 떼고 이어 그리세요.');break;}
        session.stroke.points.push(p);paint(ctx,{...session.stroke,points:[a,p]});
      }
    });
    for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,e=>{if(e.pointerId===session.pointer)finish();});
    root.addEventListener('click',e=>{
      const target=e.target.closest('button');if(!target)return;
      if(target.dataset.inkTool){preferences.tool=target.dataset.inkTool;root.querySelectorAll('[data-ink-tool]').forEach(b=>b.setAttribute('aria-pressed',b===target));}
      if(target.dataset.inkColor){preferences.color=target.dataset.inkColor;root.querySelectorAll('[data-ink-color]').forEach(b=>b.setAttribute('aria-pressed',b===target));}
      const action=target.dataset.inkAction;if(!action||!session.loaded)return;
      finish();
      if(action==='download'){
        const image=document.createElement('canvas');image.width=WIDTH;image.height=HEIGHT;const c=image.getContext('2d');c.fillStyle='#ffffff';c.fillRect(0,0,WIDTH,HEIGHT);c.drawImage(canvas,0,0);
        const a=document.createElement('a');a.download=`코드한문제_${id}_그림장.png`;a.href=image.toDataURL('image/png');a.click();return;
      }
      if(action==='clear'){
        if(!clearPending){clearPending=true;target.textContent='한 번 더 눌러 지우기';return;}
        session.history.change([]);clearPending=false;target.textContent='전체 지우기';
      }else if(action==='undo')session.history.undo();
      else if(action==='redo')session.history.redo();
      redraw();persist();
    });
    root.addEventListener('change',e=>{if(e.target.matches('select'))preferences.size=+e.target.value;if(e.target.matches('[data-ink-finger]'))preferences.finger=e.target.checked;});
    store.get(id).then(page=>{
      if(session.disposed)return;
      session.history=new Timeline(page.strokes);session.updatedAt=page.updatedAt;session.loaded=true;status.textContent='이 기기에 자동 저장';redraw();
    }).catch(()=>{status.textContent='필기를 불러오지 못했습니다.';notify('필기를 불러오지 못했습니다. 닫았다가 다시 열어 주세요.');});
  }
  function dispose() { if(active){active.finish?.();active.disposed=true;active=null;} }
  async function flush() { active?.finish?.();if(active)await active.writes; }
  window.addEventListener('pagehide',()=>active?.finish?.());
  window.Notebook={mount,dispose,flush,store,cleanPage,Timeline};
})();

  function codeHTML(code,language,tools=false){
    if(state.settings.formatCode!==false)code=window.CodeDisplay?.formatCode(code,language)||code;
    // Escape every character. Highlight only after tokenization, so code never becomes markup.
    const re=/(\/\/[^\n]*|#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:class|def|return|if|else|elif|for|while|switch|case|break|continue|static|int|char|void|new|public|private|extends|implements|try|catch|finally|except|raise|import|from|lambda|nonlocal|const|struct|enum|boolean|double|float|True|False|None|null|true|false)\b)/g;

!list.length?'disabled':''}>무작위 20</button></div></div>${list.length?`<section class="question-list">${list.slice(0,listLimit).map(questionCard).join('')}</section>${list.length>listLimit?`<button class="secondary load-more" data-action="load-more">더 보기 (${Math.min(listLimit,list.length)} / ${list.length})</button>`:''}`:'<section class="panel empty">'+icon('book')+'<h3>조건에 맞는 문제가 없습니다.</h3><p>필터를 줄이거나 다른 언어를 골라 보세요.</p></section>'}`;

  function diverse(list,count){const mixed=shuffle(list),seen=new Set(),result=[];for(const q of mixed){if(!seen.has(q.family)){seen.add(q.family);result.push(q);if(result.length===count)return result;}}for(const q of mixed){if(!result.includes(q)){result.push(q);if(result.length===count)break;}}return result;}

    return `<div class="library-header"><div class="eyebrow">YOUR LEARNING RECORD</div><h1>지금까지의 발자취</h1><p>진도는 한 번 이상 답을 제출한 문제 수입니다. 정답률은 실제 제출 횟수 기준입니다.</p></div><section class="panel"><div class="mini-stats"><div><b>${s.completed} / ${BANK.count}</b><span>풀어 본 문제</span></div><div><b>${s.attempts}</b><span>답안 제출</span></div><div><b>${s.accuracy===null?'—':s.accuracy+'%'}</b><span>제출 정답률</span></div><div><b>${state.bookmarks.length}</b><span>즐겨찾기</span></div></div></section><div class="section-head"><h2>유형별 진도</h2></div><section class="topic-grid">${[...groups.values()].map(g=>`<div class="topic-stat"><div class="row between"><b style="font-size:13px">${names[g.language]} · ${esc(g.topic)}</b><small>${g.done}/${g.total}</small></div><div class="thin-progress"><span style="width:${g.done/g.total*100}%"></span></div>${g.wrong?`<small>다시 볼 문제 ${g.wrong}개</small>`:'<small>차근차근 채워 보세요.</small>'}</div>`).join('')}</section>`;
  }
  function settings(){return `<div class="library-header"><div class="eyebrow">MAKE IT YOURS</div><h1>편한 환경으로 공부하세요.</h1><p>학습 기록은 현재 브라우저·기기에 저장됩니다.</p></div><div class="settings-grid"><section class="panel"><h2>화면과 풀이</h2><div class="setting-row"><label for="theme">화면 테마</label><select id="theme" data-setting="theme">${[['system','기기 설정'],['light','라이트'],['dark','다크']].map(([k,v])=>option(k,v,state.settings.theme)).join('')}</select></div><div class="setting-row"><label for="code-size">코드 글자 크기<small>문제 화면의 A− / A+로도 바꿀 수 있습니다.</small></label><select id="code-size" data-setting="codeSize">${[13,14,15,16,17,18,19,20].map(n=>option(String(n),n+'px',String(state.settings.codeSize))).join('')}</select></div><div class="setting-row"><label for="timer-setting">새 세션에 20분 타이머<small>시간이 끝나도 답안은 보존되며 계속 풀 수 있습니다.</small></label><input type="checkbox" id="timer-setting" data-setting="timer" ${state.settings.timer?'checked':''}></div><div class="setting-row"><label for="space-setting">정답에서 공백·줄바꿈 표시<small>공백 · / 줄바꿈 ↵ 표시로 출력 형식을 확인합니다.</small></label><input type="checkbox" id="space-setting" data-setting="whitespace" ${state.settings.whitespace?'checked':''}></div></section><section class="panel"><h2>학습 기록 백업</h2><p class="info-copy" style="margin:12px 0 17px">Android와 iPad의 기록은 자동 동기화되지 않습니다. 메모와 그림장까지 백업 파일로 내보내 다른 기기로 옮긴 뒤 가져오세요. 기존 기록과 병합하며 같은 파일을 다시 가져와도 횟수가 중복 합산되지 않습니다.</p><div class="row wrap"><button class="primary" data-action="export">백업 내보내기</button><button class="secondary" data-action="import">백업 가져오기</button></div></section><section class="panel"><h2>홈 화면·오프라인</h2><p class="info-copy" style="margin:12px 0">${offlineReady?'이 기기에 문제와 앱 파일을 저장했습니다. 인터넷 없이 다시 열어 풀 수 있습니다.':offlineError?'오프라인 파일 저장을 완료하지 못했습니다. 인터넷에 연결한 상태로 다시 열어 주세요.':'앱과 문제를 이 기기에 저장하는 중입니다. 처음 한 번은 인터넷 연결이 필요합니다.'} 브라우저 데이터를 지우면 학습 기록과 오프라인 파일도 사라질 수 있으니 백업해 두세요.</p><button class="secondary" data-action="install">설치 방법 보기</button></section><section class="panel"><h2>문제 구성</h2><p class="info-copy" style="margin:12px 0">C·Java·Python 각120문항, 총360문항입니다. 대표 문제72개와 새 코드 유형72개의 데이터 변형4개를 포함합니다. 모든 문제는 자체 제작이며 기출 원문이 아닙니다. 빈칸·오류 수정형은 모범 수정 코드, 나머지는 제시 코드의 실행 결과를 검증했습니다. 난이도는 학습용 분류입니다.</p><p class="info-copy">앱 버전 ${APP_VERSION} · Python 3 / C11 / Java17<br>답안은 기기에서 비교하며 사용자가 쓴 코드를 서버로 전송하거나 실행하지 않습니다.</p></section></div>`;}
  function render(scroll=false){
    window.Notebook?.dispose();
    applySettings();const activeId=document.activeElement?.id,selection=document.activeElement?.selectionStart;
    const views={home,library,review,practice,stats,settings};app.innerHTML=shell((views[route]||home)());
    if(route==='practice'&&!state.active?.finished&&notebookOpen&&notebookTab==='draw')window.Notebook?.mount(document.getElementById('ink-pad'),current().id,toast);
    if(scroll){window.scrollTo({top:0,behavior:'instant'});document.getElementById('main')?.focus({preventScroll:true});}
    else if(activeId==='search'){const el=document.getElementById('search');el?.focus({preventScroll:true});if(typeof selection==='number')el?.setSelectionRange(selection,selection);}
  }
  function current(){return state.active?byId.get(state.active.ids[state.active.index]):null;}
  function move(index){const s=state.active;if(!s)return;s.index=Math.max(0,Math.min(s.ids.length-1,index));save();render(true);}
  async function exportBackup(){
    await window.Notebook?.flush();
    const drawings=window.Notebook?await window.Notebook.store.all():[];
    const payload={app:'ipe-code-practice',schema:1,bankVersion:BANK.version,exportedAt:new Date().toISOString(),history:state.history,bookmarks:state.bookmarks,notes:state.notes,drawings,settings:state.settings};
    const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`코드한문제_학습백업_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('백업 파일을 저장했습니다.');
  }
  async function importBackup(data){
    if(!data||data.app!=='ipe-code-practice'||data.schema!==1||!data.history||typeof data.history!=='object'||Array.isArray(data.history))throw new Error('이 앱의 백업 파일이 아닙니다.');
    const drawingsAdded=window.Notebook?await window.Notebook.store.merge(data.drawings,new Set(byId.keys())):0;
    let n=0;
    for(const [id,value] of Object.entries(data.history)){
      if(!byId.has(id)||!value||typeof value!=='object')continue;
      const attempts=Math.min(1e6,Math.max(0,Math.floor(Number(value.attempts)||0))),correctAttempts=Math.min(attempts,Math.max(0,Math.floor(Number(value.correctAttempts)||0)));
      const seenAt=Number(value.seenAt);if(!Number.isFinite(seenAt)||!['correct','wrong','revealed'].includes(value.lastStatus))continue;
      const clean={attempts,correctAttempts,seenAt,lastStatus:value.lastStatus,lastAnswer:typeof value.lastAnswer==='number'?value.lastAnswer:String(value.lastAnswer??'').slice(0,20000)};
      const old=state.history[id];if(!old||clean.seenAt>old.seenAt){state.history[id]={...clean,attempts:Math.max(old?.attempts||0,attempts),correctAttempts:Math.max(old?.correctAttempts||0,correctAttempts)};n++;}
    }
    if(Array.isArray(data.bookmarks))state.bookmarks=[...new Set([...state.bookmarks,...data.bookmarks.filter(id=>byId.has(id))])];
    if(data.notes&&typeof data.notes==='object')for(const [id,note] of Object.entries(data.notes)){if(byId.has(id)&&typeof note==='string'&&!state.notes[id])state.notes[id]=note.slice(0,10000);}
    save();render();toast(`${n}개 문제 기록과 ${drawingsAdded}개 그림장을 병합했습니다.`);
  }
  function help(install=false){
    const d=document.getElementById('help-dialog');
    d.innerHTML=install?`<h2 id="help-title">홈 화면에서 앱처럼 열기</h2><h3>iPad · iPhone</h3><ol><li>이 주소를 Safari에서 엽니다.</li><li>공유 버튼에서 ‘홈 화면에 추가’를 선택합니다.</li><li>‘웹 앱으로 열기’가 보이면 켜고 추가합니다.</li></ol><h3>Android</h3><ol><li>Chrome에서 이 주소를 엽니다.</li><li>메뉴의 ‘앱 설치’ 또는 ‘홈 화면에 추가’를 선택합니다.</li></ol><p>처음 한 번 온라인으로 열고 ‘오프라인 풀이 준비 완료’를 확인하세요. 학습 기록은 기기마다 따로 저장되며 설정의 백업으로 옮길 수 있습니다.</p>${installPrompt?'<button class="primary" data-action="native-install">이 기기에 설치</button>':''}<button class="secondary" data-action="close-help" style="width:100%;margin-top:12px">닫기</button>`:`<h2 id="help-title">한 문제씩, 이렇게 공부하세요.</h2><ol><li>언어·유형을 골라 문제를 시작합니다.</li><li>출력 또는 빈칸을 쓰고 ‘정답 확인’을 누릅니다.</li><li>정답과 설명, 중간 상태를 비교합니다.</li><li>어려운 문제는 별로 저장하고 오답 메모를 남깁니다.</li><li>복습에서 다시 풀고 다른 기기로 옮기기 전 백업합니다.</li></ol><p>마지막 줄바꿈·줄 끝 공백은 무시하지만 중간 공백과 대소문자는 구분합니다. ‘잘 모르겠어요’로 해설을 보면 오답 복습에 모이며 정답률에는 정답으로 집계되지 않습니다.</p><button class="primary" data-action="close-help">알겠습니다</button>`;
    d.showModal();
  }
  document.addEventListener('click',async event=>{
    const el=event.target.closest('[data-action]');if(!el||el.disabled)return;
    const action=el.dataset.action,q=current(),s=state.active;
    if(action==='nav')go(el.dataset.page);
    else if(action==='language'){filters={language:el.dataset.lang,topic:'all',kind:'all',level:'all',status:'all',search:''};listLimit=36;go('library');}
    else if(action==='filter-language'){filters.language=el.dataset.lang;filters.topic='all';listLimit=36;render();}
    else if(action==='clear-filters'){filters={language:'all',topic:'all',kind:'all',level:'all',status:'all',search:''};render();}
    else if(action==='core')start(questions.filter(q=>q.core),'핵심 대표 72문항');
    else if(action==='random')start(questions,'무작위 20문항',true);
    else if(action==='resume')go('practice');
    else if(action==='start-filtered')start(filtered(),'선택한 유형 연습');
    else if(action==='filtered-random')start(filtered(),'선택 유형 · 무작위 20',true);
    else if(action==='load-more'){listLimit+=36;render();}
    else if(action==='open-filtered'){
      const list=route==='review'?(reviewTab==='saved'?state.bookmarks.map(id=>byId.get(id)).filter(Boolean):questions.filter(q=>['wrong','revealed'].includes(state.history[q.id]?.lastStatus))):filtered();
      const i=list.findIndex(q=>q.id===el.dataset.id);start(i>=0?[...list.slice(i),...list.slice(0,i)]:[byId.get(el.dataset.id)],'유형별 문제 풀이');
    }
    else if(action==='open-question')start([byId.get(el.dataset.id)],'한 문제 다시 풀기');
    else if(action==='review-tab'){reviewTab=el.dataset.tab;render();}
    else if(action==='start-review')start(reviewTab==='saved'?state.bookmarks.map(id=>byId.get(id)).filter(Boolean):questions.filter(q=>['wrong','revealed'].includes(state.history[q.id]?.lastStatus)),'복습 세션');
    else if(action==='bookmark'&&q){state.bookmarks=state.bookmarks.includes(q.id)?state.bookmarks.filter(id=>id!==q.id):[...state.bookmarks,q.id];save();render();}
    else if(action==='submit'&&q){
      const value=q.mode==='choice'?(document.querySelector('input[name=choice]:checked')?.value??''):document.getElementById('answer-input').value;
      if(value===''){toast('답을 입력하거나 하나를 선택해 주세요.');return;}
      s.drafts[q.id]=value;record(q,q.mode==='choice'?+value:value);
    }
    else if(action==='reveal'&&q)record(q,'',true);
    else if(action==='self-correct'&&q&&q.mode==='text'&&s.results[q.id]&&!s.results[q.id].correct&&!s.results[q.id].revealed){s.results[q.id].correct=true;s.results[q.id].selfAssessed=true;state.history[q.id].correctAttempts++;state.history[q.id].lastStatus='correct';save();render();toast('스스로 확인한 정답으로 표시했습니다.');}
    else if(action==='retry-current'&&q){delete s.results[q.id];delete s.drafts[q.id];save();render();}
    else if(action==='next'&&s){if(s.index===s.ids.length-1){s.finished=true;save();render(true);}else move(s.index+1);}
    else if(action==='previous'&&s)move(s.index-1);
    else if(action==='jump'&&s)move(+el.dataset.index);
    else if(action==='finish'&&s){s.finished=true;save();render(true);}
    else if(action==='reopen'&&s){s.finished=false;move(+el.dataset.index);}
    else if(action==='retry-session'&&s)start(s.ids.filter(id=>!s.results[id]?.correct).map(id=>byId.get(id)),'오답·미풀이 복습');
    else if(action==='font-up'||action==='font-down'){state.settings.codeSize=Math.max(13,Math.min(20,state.settings.codeSize+(action==='font-up'?1:-1)));save();applySettings();}
    else if(action==='notebook-toggle'){notebookOpen=!notebookOpen;if(!notebookOpen)notebookLarge=false;render();}
    else if(action==='notebook-tab'){notebookTab=el.dataset.tab;render();}
    else if(action==='notebook-large'){notebookLarge=!notebookLarge;render();}
    else if(action==='code-format'){state.settings.formatCode=state.settings.formatCode===false;save();render();}
    else if(action==='wrap-code'){state.settings.codeWrap=state.settings.codeWrap===false;save();render();}
    else if(action==='export'){try{await exportBackup();}catch{toast('백업 파일을 만들지 못했습니다. 저장 공간과 다운로드 권한을 확인하세요.');}}
    else if(action==='import')document.getElementById('import-file').click();
    else if(action==='help')help();
    else if(action==='install')help(true);
    else if(action==='close-help')document.getElementById('help-dialog').close();
    else if(action==='native-install'&&installPrompt){await installPrompt.prompt();installPrompt=null;document.getElementById('help-dialog').close();}
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    if(el.dataset.filter){filters[el.dataset.filter]=el.value;listLimit=36;render();}
    if(el.dataset.setting){state.settings[el.dataset.setting]=el.type==='checkbox'?el.checked:el.dataset.setting==='codeSize'?+el.value:el.value;save();applySettings();}
    if(el.name==='choice'&&current()){state.active.drafts[current().id]=el.value;save();}
  });
  document.addEventListener('input',event=>{
    const el=event.target;
    if(el.id==='search'){clearTimeout(searchTimer);const value=el.value;searchTimer=setTimeout(()=>{filters.search=value;listLimit=36;render();},220);}
    if(el.id==='answer-input'&&current()){state.active.drafts[current().id]=el.value.slice(0,20000);clearTimeout(inputTimer);inputTimer=setTimeout(save,200);}
    if(['note-input','scratch-note'].includes(el.id)&&current()){state.notes[current().id]=el.value.slice(0,10000);const other=document.getElementById(el.id==='note-input'?'scratch-note':'note-input');if(other)other.value=el.value;clearTimeout(inputTimer);inputTimer=setTimeout(save,200);}
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&notebookLarge){notebookLarge=false;render();return;}if((event.ctrlKey||event.metaKey)&&event.key==='Enter'&&route==='practice'){event.preventDefault();document.querySelector('[data-action=submit]:not(:disabled)')?.click();}});
  document.getElementById('import-file').addEventListener('change',async event=>{
    const file=event.target.files[0];event.target.value='';if(!file)return;
    if(file.size>20*1024*1024){toast('백업 파일은 20MB 이하만 가져올 수 있습니다.');return;}
    try{await importBackup(JSON.parse(await file.text()));}catch(error){toast(error.message||'백업 파일을 읽지 못했습니다.');}
  });
  setInterval(()=>{const el=document.getElementById('timer');if(el&&state.active&&!state.active.finished){el.textContent=timeText();el.classList.toggle('urgent',!!state.active.limitMs&&Date.now()-state.active.startedAt>state.active.limitMs-60000);}},1000);
  window.addEventListener('online',()=>{if(route==='settings'||route==='home')render();});
  window.addEventListener('offline',()=>render());
  window.addEventListener('beforeunload',save);
  window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;});
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.settings.theme==='system')applySettings();});
  render();
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='OFFLINE_READY'){offlineReady=true;offlineError=false;if(route==='home'||route==='settings')render();}});
    setTimeout(()=>{if(!offlineReady){offlineError=true;if(route==='home'||route==='settings')render();}},15000);
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).then(reg=>{reg.active?.postMessage({type:'STATUS'});}).catch(()=>{offlineError=true;if(route==='settings')render();});
  }else offlineError=true;
  // Pure functions used by the local test harness; no user code is evaluated.
  window.CodePractice={normalizeOutput,normalizeCode,checkAnswer,importBackup,codeHTML,version:APP_VERSION};
})();

</script>
